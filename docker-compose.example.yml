# Example deployment. Copy to docker-compose.yml (git-ignored: it will hold your secrets) and adjust
# APP_CONFIG is merged over /app/config.yaml at startup (APP_CONFIG wins on conflicts).

# Networks
networks:
  internal:
    external: true

# Volumes
volumes:
  config:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: "/mnt/docker-volumes/image-organizer"
  media:
    driver: local
    driver_opts:
      type: nfs
      o: addr=z0-nas-01.home.lan,rw,noatime,rsize=8192,wsize=8192,tcp,timeo=14,nfsvers=4
      device: ":/mnt/TANK/Media/Pictures"
  import:
    driver: local
    driver_opts:
      type: nfs
      o: addr=z0-nas-01.home.lan,rw,noatime,rsize=8192,wsize=8192,tcp,timeo=14,nfsvers=4
      device: ":/mnt/TANK/Media/Import"
  trash:
    driver: local
    driver_opts:
      type: nfs
      o: addr=z0-nas-01.home.lan,rw,noatime,rsize=8192,wsize=8192,tcp,timeo=14,nfsvers=4
      device: ":/mnt/TANK/Media/Trash"

# Services
services:
  image-organizer:
    image: ghcr.io/zeroomar/image-organizer:latest
    container_name: image-organizer
    hostname: image-organizer
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=internal"
      # service config
      - "traefik.http.services.image-organizer.loadbalancer.server.port=80"
      # https entrypoint
      - "traefik.http.routers.image-organizer-secure.entrypoints=https"
      - "traefik.http.routers.image-organizer-secure.rule=Host(`image-organizer.home.lan`)"
      - "traefik.http.routers.image-organizer-secure.tls=true"
      - "traefik.http.routers.image-organizer-secure.service=image-organizer"
      - "traefik.http.routers.image-organizer-secure.middlewares=default-headers@file"
    environment:
      TZ: Africa/Cairo
      PUID: 1000
      PGID: 1000
      APP_CONFIG: |
        admin:
          username: admin
          # bcrypt hash; escape every $ as $$ in compose files
          # generate: docker run --rm ghcr.io/zeroomar/image-organizer hash-password 'your-password'
          passwordHash: "$$2b$$12$$replace-with-generated-hash"
        session:
          secret: change-me-long-random-string
          ttlHours: 24
        media:
          root: /media
        import:
          root: /import
          maxUploadMB: 2048
        trash:
          root: /trash
          retentionDays: 30
        timezone:
          default: Africa/Cairo
        map:
          tileUrl: "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
    volumes:
      - config:/app
      - media:/media
      - import:/import
      - trash:/trash
    networks:
      - internal
